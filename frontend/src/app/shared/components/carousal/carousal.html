<div id="carousel-container">


  <div class="carousel-slides">
    <img [src]="url" [alt]="alt">
  </div>






</div>

  <a class="prev" (click)="nextSlide(-1)">&#10094;</a>
  <a class="next" (click)="nextSlide(1)">&#10095;</a>

<div id="indicator-group">
  <span class="indicator" (click)="currentSlide(1)"></span>
  <span class="indicator" (click)="currentSlide(2)"></span>
  <span class="indicator" (click)="currentSlide(3)"></span>
</div>
