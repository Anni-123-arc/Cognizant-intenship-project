<div class="saved-address-container">
  <h3>Saved Addresses</h3>

  <div class="address-list">
    <div class="address-card" *ngFor="let address of addresses">
      <p><strong>{{ address.label }}</strong> <span *ngIf="address.isDefault">(Default)</span></p>
      <p>{{ address.addressLine1 }}</p>
      <p *ngIf="address.addressLine2">{{ address.addressLine2 }}</p>
      <p>{{ address.city }}, {{ address.state }} - {{ address.postalCode }}</p>
      <p>{{ address.country }}</p>
      <div class="address-actions">
        <button class="edit-btn" (click)="editAddress(address)">Edit</button>
        <button class="delete-btn" (click)="deleteAddress(address._id)">Delete</button>
      </div>
    </div>
  </div>

  <button class="add-address-btn" (click)="addAddress()">+ Add New Address</button>
</div>
