<div class="container">
  <h2>Register</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <input formControlName="name" placeholder="Name" type="text" />
    <div *ngIf="submitted && registerForm.get('name')?.invalid" class="error">Name is required</div>

    <input formControlName="email" placeholder="Email" type="email" />
    <div *ngIf="submitted && registerForm.get('email')?.invalid" class="error">
      {{ registerForm.get('email')?.errors?.['required'] ? 'Email is required' : 'Enter a valid email' }}
    </div>

    <input formControlName="password" placeholder="Password" type="password" />
    <div *ngIf="submitted && registerForm.get('password')?.invalid" class="error">Password is required</div>

    <input formControlName="confirmPassword" placeholder="Confirm Password" type="password" />
    <div *ngIf="submitted && registerForm.get('confirmPassword')?.invalid" class="error">
      Confirm Password is required
    </div>

    <div *ngIf="submitted && registerForm.errors?.['passwordMismatch']" class="error">
      Passwords do not match
    </div>

    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a (click)="goToLogin()">Login</a></p>
</div>
