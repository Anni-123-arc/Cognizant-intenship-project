<form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!success">
  <label>Email:</label>
  <input formControlName="email" type="email" readonly />
  <br />

  <label>OTP:</label>
  <input formControlName="otp" type="text" />
  <br />

  <label>New Password:</label>
  <input formControlName="newPassword" type="password" />
  <br />

  <label>Confirm Password:</label>
  <input formControlName="confirmPassword" type="password" />
  <br />

  <button type="submit" [disabled]="loading">Reset Password</button>
</form>

<!-- Success message after reset -->
<div *ngIf="success" style="color: green; font-weight: bold;">
  {{ message }} Redirecting to login...
</div>

<!-- Error message -->
<p *ngIf="!success && message && !loading" style="color: red;">
  {{ message }}
</p>
