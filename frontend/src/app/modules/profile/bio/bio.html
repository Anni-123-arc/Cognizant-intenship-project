<div class="bio-container">
  <h2>Edit Bio</h2>
  <form [formGroup]="bioForm" (ngSubmit)="onSave()">
    <div class="form-row">
      <label>First Name</label>
      <input type="text" placeholder="First Name" formControlName="firstName" required/>
    </div>

    <div class="form-row">
      <label>Last Name</label>
      <input type="text" placeholder="Last Name" formControlName="lastName" />
    </div>

    <div class="form-row">
      <label>Email</label>
      <input type="email" placeholder="example@xyz.com" formControlName="email" required/>
    </div>

    <div class="form-row">
      <label>Phone Number</label>
      <input type="text" placeholder="Enter 10 digits only." formControlName="phone" required/>
    </div>

    <div class="form-row">
      <label>Address Line 1</label>
      <textarea formControlName="address1" rows="2" placeholder="Address" required></textarea>
    </div>

    <div class="form-row">
      <label>Address Line 2</label>
      <textarea formControlName="address2" placeholder="Address" rows="2"></textarea>
    </div>

    <div class="form-actions">
      <a (click)="goToChangePassword()" class="link">Change Password</a>
      <button type="submit" [disabled]="!bioForm.valid">Save</button>
    </div>
  </form>
</div>
