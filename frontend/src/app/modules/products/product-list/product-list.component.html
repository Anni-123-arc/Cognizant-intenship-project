<section id="home-wrapper" class="home-layout">
  <app-home-header></app-home-header>

  <!--<app-search-filter></app-search-filter>-->
  <app-scrollable-menu-bar></app-scrollable-menu-bar>

  <div class="main-content">
    <aside class="sidebar">
      <app-side-bar></app-side-bar>
    </aside>

    <!-- Reserved space for other main content -->
    <section class="content-area">
      <!-- You can add content here later -->
    </section>
  </div>

  <div class="product-grid">
    <div class="product-card" *ngFor="let product of products">
      <img [src]="product.image" [alt]="product.name" />
      <!--<img [src]="product.image" alt="{{ product.name }}" width="200" />-->
      <h3 class="product-name">{{ product.name }}</h3>
      <p class="brand">Brand: {{ product.brand }}</p>
      <p class="price">₹ {{ product.price }}</p>
      <a [routerLink]="['/products', product.id]" class="view-btn">View Details</a>
    </div>
  </div>

  <app-footer></app-footer>
</section>
