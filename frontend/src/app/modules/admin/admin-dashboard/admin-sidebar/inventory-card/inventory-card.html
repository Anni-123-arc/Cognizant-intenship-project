<div class="card">
  <div class="card-content">
    <div id="row-1">
      <div>
        <strong>Product ID</strong>
        <span>{{ product_id }}</span>
      </div>
      <div>
        <strong>Name</strong>
        <span>{{ product_name }}</span>
      </div>
      <div>
        <strong>Category</strong>
        <span>{{ category }}</span>
      </div>
    </div>
    <div id="row-2">
      <div>
        <strong>Price</strong>
        <span>₹{{ price }}</span>
      </div>
      <div>
        <strong>Stock</strong>
        <span>690</span>
      </div>
      <div>
          <span (click)="onDelete()"><img src="../../../../../../assets/AdminAssets/delete.png" alt=""></span>
      </div>
    </div>
  </div>
</div>
