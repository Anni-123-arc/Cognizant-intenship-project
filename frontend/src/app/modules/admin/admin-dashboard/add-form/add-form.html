<div class="modal-overlay" (ngSubmit)="onSubmit()">
  <div class="modal">
    <h2>Add Products</h2>
    <form>
      <div class="form-row">
        <label for="Product_Name">Product Name:</label>
        <input type="text" id="Product_Name" [(ngModel)]="Product_Name" name="Product_Name" required />
      </div>

      <div class="form-row">
        <label for="Quantity">Quantity:</label>
        <input type="number" id="Quantity" [(ngModel)]="Quantity" name="Quantity" required />
      </div>

      <div class="form-row">
        <label for="Price">Price:</label>
        <input type="number" id="Price" [(ngModel)]="Price" name="Price" required />
      </div>

      <div class="actions">
        <button type="submit">Add</button>
        <button type="button">Cancel</button>
      </div>
    </form>
  </div>
</div>
