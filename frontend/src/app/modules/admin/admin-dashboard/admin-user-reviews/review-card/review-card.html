
<div id="main-review-container">
    <div id="user-info">
        <div id="image">
            <img src={{messages.profileImage}} alt="user-image">
        </div>
       <span>{{messages.name}}</span>
       <span id="date">{{messages.date}}</span>
    </div>
    <div id="review">
        <p>{{messages.message}}</p>
    </div>
</div>
