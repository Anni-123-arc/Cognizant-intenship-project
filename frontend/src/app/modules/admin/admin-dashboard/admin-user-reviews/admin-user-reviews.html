<div id="main-message-container" (scroll)="onScroll($event)">
    <div id="heading" [class.hide]="hideHeading">
        <div id="message-icon">
            <img src="../../../../../assets/AdminAssets/icons8-message-48.png" alt="message-icon">
        </div>
        <h2>User Messages</h2>
    </div>
    
    @for(msg of messages; track msg.id) {
        <app-review-card [messages]="msg"></app-review-card>
    }
   
</div>
